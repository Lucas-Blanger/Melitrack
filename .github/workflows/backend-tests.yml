name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      DB_HOST: localhost
      DB_PORT: 5432

      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: 123456
      MONGO_DB: melitrack_photos_db
      MONGO_URL: mongodb://admin:123456@localhost:27017/?authSource=admin

      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      APP_NAME: Melitrack
      APP_VERSION: "1.0.0"
      API_PORT: 8000
      COOKIE_SECURE: false
      DEBUG: "false"

      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM: test@example.com

      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback

      ML_SERVICE_URL: http://localhost:8001
      ML_SERVICE_TOKEN: test-ml-token

      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/api/requirements-dev.txt
            backend/ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/api/requirements-dev.txt

      - name: Install ML dependencies
        run: |
          pip install -r backend/ml/requirements.txt

      - name: Run API tests
        run: |
          cd backend/api
          python -m pytest

      - name: Run ML tests
        run: |
          cd backend/ml
          python -m pytest
