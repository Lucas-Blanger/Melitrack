services:
  api:
    build: .
    container_name: melitrack-api
    env_file:
      - .env
    environment:
      LOG_FILE: /var/log/melitrack/api.log
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/app
      - ../logs:/var/log/melitrack
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
    networks:
      - melitrack-network

  db:
    profiles: ["local-db"]
    image: postgres:16
    container_name: melitrack_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-melitrack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-melitrack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - melitrack-network

volumes:
  postgres_data:

networks:
  melitrack-network:
    external: true
