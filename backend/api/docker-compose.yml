services:
  api:
    build: .
    container_name: melitrack-api
    ports:
      - "${API_PORT}:8000"

    volumes:
      - .:/app

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
  db:
    image: postgres:16
    container_name: melitrack_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d melitrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
