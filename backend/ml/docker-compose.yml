services:
  ml:
    profiles: ["ai"]
    build: .
    container_name: melitrack-ml
    env_file:
      - .env
    environment:
      LOG_FILE: /var/log/melitrack/ml.log
    ports:
      - "${ML_PORT:-8001}:8000"
    volumes:
      - .:/app
      - ../logs:/var/log/melitrack
    depends_on:
      - redis
    networks:
      - melitrack-network

  ml-worker:
    profiles: ["ai"]
    build: .
    container_name: melitrack-ml-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ml --pool=threads --concurrency=4
    env_file:
      - .env
    environment:
      LOG_FILE: /var/log/melitrack/ml-worker.log
    volumes:
      - .:/app
      - ../logs:/var/log/melitrack
    depends_on:
      - redis
    networks:
      - melitrack-network

  redis:
    profiles: ["ai"]
    image: redis:7-alpine
    container_name: melitrack_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - melitrack-network

networks:
  melitrack-network:
    external: true
